<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Meter V2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <!-- PANTALLA INICIAL -->
    <section id="welcome">
      <h1>Human Meter</h1>
      <p>Un recorrido de autoconocimiento semanal.</p>
      <button onclick="startV2()">Comenzar experiencia</button>
    </section>

    <!-- PANTALLA DE PREGUNTAS SEMANALES (1 A 3) -->
    <section id="test" class="hidden">
      <h2 id="weekTitle">Semana</h2>
      <div class="thermo-bar">
        <div id="thermoFill" class="thermo-fill"></div>
      </div>
      <p id="questionMeasure" class="measure-tag"></p>
      <p id="questionText" class="question-text"></p>
      <div class="buttons-grid">
        <button onclick="answer(0)">Nunca / Nada</button>
        <button onclick="answer(1)">A veces / Poco</button>
        <button onclick="answer(2)">Casi siempre / Mucho</button>
      </div>
    </section>

    <!-- DEVOLUCIÓN SEMANAL (CON BOTÓN BLOQUEADO A 7 DÍAS) -->
    <section id="weeklyResult" class="hidden">
      <div id="weeklySymbol" class="symbol-display"></div>
      <div id="weeklyTextWrap">
        <p id="weeklyText" class="result-text"></p>
        <p id="weeklyAdvice" class="advice-text"></p>
        <!-- Este botón llama a nextWeek() que evalúa los 7 días -->
        <button onclick="nextWeek()">Continuar</button>
      </div>
    </section>

    <!-- PANTALLA MENSUAL DE TRANSICIÓN AL ESPEJO -->
    <section id="monthlyResult" class="hidden">
      <h2>Fin de las 3 semanas</h2>
      <p>Has completado el ciclo inicial de observación.</p>
      <!-- Este botón evalúa los 7 días desde la Semana 3 antes de ir a la intro -->
      <button onclick="gateMirrorIntro()">Mirar tu reflejo</button>
    </section>

    <!-- INTRODUCCIÓN AL ESPEJO -->
    <section id="mirrorIntro" class="hidden">
      <h2>El Espejo</h2>
      <p>A continuación ingresarás en una etapa de autoobservación más profunda. Responde con la mayor honestidad posible.</p>
      <!-- Este botón evalúa los 7 días antes de iniciar el test del Espejo -->
      <button onclick="startMirror()">Entrar al Espejo</button>
    </section>

    <!-- PANTALLA DE PREGUNTAS DEL ESPEJO -->
    <section id="mirrorTest" class="hidden">
      <div id="mirrorEmoji" class="mirror-emoji">😡</div>
      <p id="mirrorQuestion" class="question-text"></p>
      <div class="buttons-grid">
        <button onclick="answerMirror(0)">No me pasa / Mínimo</button>
        <button onclick="answerMirror(1)">Moderado</button>
        <button onclick="answerMirror(2)">Intenso / Frecuente</button>
      </div>
    </section>

    <!-- PANTALLA FINAL INTEGRAL -->
    <section id="finalResult" class="hidden">
      <h2>Devolución Final</h2>
      <div id="finalTextWrap">
        <h3 id="finalState" class="state-title"></h3>
        <p id="finalHumanText" class="result-text"></p>
        <button onclick="startV2()">Volver a empezar</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
